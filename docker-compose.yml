version: '3.8'

services:
  client:
    image: yashrajx/blogify-client:latest
    restart: always
    ports:
      - "80:80" # Expose Nginx port for the world.
      - "443:443" # Expose the Nginx service to the outside world
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro # For SSL certificates
    environment:
      VITE_API_BACKEND_URL: https://blogify-app.work.gd/api
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    depends_on:
      api:
        condition: service_started # Client waits for API to be started

  api:
    image: yashrajx/blogify-api:latest
    restart: always
    environment:
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME}
      CORS_DOMAIN_URL:  ${CORS_DOMAIN_URL}
    ports:
      - "4000:4000" # Expose API port for Nginx to access internally.eg here the first 4000 is exposed to the outside world and second 4000 is inside the container

