version: '3.8'

services:
  client:
    image: yashrajx/blogify-client:latest
    restart: always
    environment:
      VITE_API_BACKEND_URL: https://blogify-app.work.gd/api
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    depends_on:
      api:
        condition: service_healthy # Client waits for API to be healthy

  api:
    image: yashrajx/blogify-api:latest
    restart: always
    environment:
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME}
      CORS_DOMAIN_URL:  ${CORS_DOMAIN_URL}
    ports:
      - "4000:4000" # Expose API port for Nginx to access internally.eg here the first 4000 is exposed to the outside world and second 4000 is inside the container
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"] # Assuming a health endpoint exists
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s # Give the API time to start up

  nginx:
    image: nginx:alpine
    restart: always
    ports:

      - "80:80" # Expose Nginx port for the world. eg here the first 80 is exposed to the outside world and second 80 is inside the container
      - "443:443" # Expose the Nginx service to the outside world
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro # For Nginx configuration files. eg: here nginx.conf is assumed to contain Nginx configuration
      - ./ssl:/etc/nginx/ssl:ro # For SSL certificates .eg: here ssl folder is assumed to contain certificate and key files it is then mounted to /etc/nginx/ssl
    depends_on:
      client:
        condition: service_started # Client doesn't need healthcheck for Nginx to start
      api:
        condition: service_healthy # Nginx waits for API to be healthy
