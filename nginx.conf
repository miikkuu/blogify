events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  server {
    listen 80;
    server_name blogify-app.work.gd www.blogify-app.work.gd;
    return 301 https://$host$request_uri; # Redirect HTTP to HTTPS
  }

  server {
    listen 443 ssl;
    server_name blogify-app.work.gd www.blogify-app.work.gd;

    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Serve static files
    location / {
      root /usr/share/nginx/html;
      index index.html;
      try_files $uri $uri/ /index.html;
      # Fix Cross-Origin-Opener-Policy warnings
      add_header Cross-Origin-Opener-Policy "unsafe-none";
      add_header Cross-Origin-Embedder-Policy "unsafe-none";
    }

    # Special handling for config.js to prevent caching
    location = /config.js {
        alias /usr/share/nginx/html/config.js;
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # API proxy
    location /api {
      proxy_pass http://api:4000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}

